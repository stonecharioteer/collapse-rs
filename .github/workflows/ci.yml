name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check demo scripts
        run: |
          shellcheck demo/demo-task scripts/*.sh
          python3 -m py_compile demo/drive-demo.py

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features --locked

      - name: Check package contents
        run: cargo package --locked

      - name: Check Markdown formatting
        run: npx --yes prettier@3.9.6 --check "**/*.md"

  macos-install:
    name: Install and launch on macOS
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install release binary
        run: cargo install --path . --root "$RUNNER_TEMP/collapse-install" --locked

      - name: Verify code signature and launch
        run: |
          codesign --verify --strict --verbose=2 "$RUNNER_TEMP/collapse-install/bin/collapse"
          "$RUNNER_TEMP/collapse-install/bin/collapse" --version
